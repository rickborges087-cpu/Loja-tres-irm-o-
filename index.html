<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3 Irmãos | Lanchonete</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:white;
}

/* CABEÇALHO */
header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:75px;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 6%;
    background:rgba(5,5,5,.88);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #222;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{font-size:34px;}

.logo h1{
    font-size:19px;
    line-height:18px;
}

.logo span{color:#ffc400;}

nav{
    display:flex;
    gap:30px;
}

nav a{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{color:#ffc400;}

.cart-button{
    border:0;
    background:#ffc400;
    color:#111;
    padding:12px 18px;
    border-radius:30px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.cart-button:hover{transform:scale(1.05);}

/* DESTAQUE INICIAL */
.hero{
    min-height:720px;
    display:flex;
    align-items:center;
    padding:120px 7% 70px;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(
            90deg,
            #050505 0%,
            rgba(5,5,5,.95) 30%,
            rgba(5,5,5,.35) 100%
        ),
        url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1800&q=90");
    background-size:cover;
    background-position:center;
}

.hero::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    right:-200px;
    bottom:-200px;
    background:#ffc400;
    filter:blur(180px);
    opacity:.15;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:700px;
}

.hero small{
    color:#ffc400;
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
}

.hero h2{
    font-size:80px;
    line-height:.9;
    margin:15px 0 25px;
    text-transform:uppercase;
}

.hero h2 span{color:#ffc400;}

.hero p{
    color:#bbb;
    max-width:560px;
    font-size:18px;
    line-height:1.6;
}
